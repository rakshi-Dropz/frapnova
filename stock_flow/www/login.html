{% extends "templates/web.html" %}

{% block page_content %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');

  :root {
    --bg-app: #f5f6f8;
    --bg-surface: #ffffff;
    --bg-surface-elevated: #f0f2f5;
    --border-subtle: #e2e4e9;
    --border-strong: #cbd0d8;
    --text-primary: #111827;
    --text-secondary: #525866;
    --text-muted: #868c98;
    --accent-red: #e11d48;
    --accent-blue: #2563eb;
    --accent-blue-hover: #1d4ed8;
  }

  [data-theme="dark"] {
    --bg-app: #0c0f17;
    --bg-surface: #171d2b;
    --bg-surface-elevated: #202738;
    --border-subtle: #242c3d;
    --border-strong: #333e54;
    --text-primary: #f8fafc;
    --text-secondary: #9aa2b1;
    --text-muted: #626b7d;
  }

  /* HARD SUPPRESS DEFAULT FRAPPE NAVBAR CRUFT */
  .web-footer, .page-header, header.navbar, .navbar-light, .navbar-default {
    display: none !important;
  }

  html, body, .web-page, .page-container, .main-section {
    background-color: var(--bg-app) !important;
    margin: 0 !important;
    padding: 0 !important;
    min-height: 100vh;
  }

  body {
    color: var(--text-primary) !important;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    -webkit-font-smoothing: antialiased;
  }

  .font-serif-heading {
    font-family: 'Instrument Serif', Georgia, serif;
    font-weight: 400;
    letter-spacing: -0.02em;
  }

  .font-mono {
    font-family: 'JetBrains Mono', monospace !important;
  }

  /* TOP HEADER */
  .login-topbar {
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand-logo-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none !important;
  }

  .brand-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: var(--accent-red);
  }

  .brand-text {
    font-size: 0.92rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--text-primary);
  }

  .nav-pill-btn {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    font-size: 0.82rem;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 9999px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    text-decoration: none !important;
    transition: all 0.15s ease;
  }

  .nav-pill-btn:hover {
    color: var(--text-primary);
    border-color: var(--border-strong);
  }

  /* LOGIN DIALOG BOX */
  .login-stage {
    min-height: calc(100vh - 120px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .login-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    width: 100%;
    max-width: 400px;
    padding: 36px 32px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
  }

  .login-header-chip {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .login-header-chip .red-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-red);
  }

  .login-title {
    font-size: 2.4rem;
    color: var(--text-primary);
    margin: 0;
    line-height: 1.1;
  }

  .login-sub {
    font-size: 0.88rem;
    color: var(--text-secondary);
    margin-top: 6px;
    margin-bottom: 24px;
  }

  .frap-input-label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 6px;
    display: block;
  }

  .frap-text-input {
    background: var(--bg-surface-elevated) !important;
    border: 1px solid var(--border-subtle) !important;
    color: var(--text-primary) !important;
    border-radius: 8px !important;
    padding: 10px 14px !important;
    font-size: 0.9rem !important;
    width: 100%;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .frap-text-input:focus {
    border-color: var(--accent-blue) !important;
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1) !important;
  }

  .btn-login-submit {
    background: var(--text-primary);
    color: var(--bg-surface) !important;
    border: none;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 10px;
    border-radius: 8px;
    width: 100%;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .btn-login-submit:hover {
    opacity: 0.9;
  }

  .alert-login-error {
    background: #fef2f2;
    border: 1px solid #fee2e2;
    color: var(--accent-red);
    font-size: 0.8rem;
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 16px;
    display: none;
  }
</style>

<div class="login-wrapper">
  
  <header class="login-topbar">
    <a href="/home" class="brand-logo-wrap">
      <span class="brand-dot"></span>
      <span class="brand-text">FRANORA</span>
    </a>

    <div class="d-flex align-items-center gap-2">
      <button type="button" class="nav-pill-btn" id="themeToggleBtn" onclick="toggleTheme()">
        <span>🌙</span>
        <span id="themeBtnText">Dark</span>
      </button>
      <a href="/home" class="nav-pill-btn">Back to Home</a>
    </div>
  </header>

  <main class="login-stage">
    <div class="login-card">
      
      <div class="login-header-chip">
        <span class="red-dot"></span>
        <span>ACCESS CONTROL</span>
      </div>

      <h1 class="login-title font-serif-heading">Sign In</h1>
      <p class="login-sub">Enter credentials to open your FRANORA workspace</p>

      <div id="loginAlertBox" class="alert-login-error"></div>

      <form id="frappeLoginForm" onsubmit="handleFrapnoraLogin(event)">
        <div class="mb-3">
          <label class="frap-input-label" for="login_user">Username or Email</label>
          <input type="text" id="login_user" class="frap-text-input" placeholder="e.g. Administrator or agent@franora.com" required autocomplete="username">
        </div>

        <div class="mb-4">
          <label class="frap-input-label" for="login_password">Password</label>
          <input type="password" id="login_password" class="frap-text-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="btnSubmitLogin" class="btn-login-submit">
          Sign In to Portal
        </button>
      </form>

    </div>
  </main>

</div>

<script>
frappe.ready(function() {
    initTheme();
});

function initTheme() {
    var savedTheme = localStorage.getItem('frapnora_theme') || 'light';
    setTheme(savedTheme);
}

function toggleTheme() {
    var current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    setTheme(current === 'dark' ? 'light' : 'dark');
}

function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('frapnora_theme', theme);
    var textEl = document.getElementById('themeBtnText');
    if (textEl) {
        textEl.innerText = (theme === 'dark') ? 'Light' : 'Dark';
    }
}

function handleFrapnoraLogin(e) {
    e.preventDefault();
    var usr = document.getElementById('login_user').value.trim();
    var pwd = document.getElementById('login_password').value;
    var btn = document.getElementById('btnSubmitLogin');
    var alertBox = document.getElementById('loginAlertBox');

    if (!usr || !pwd) return;

    btn.disabled = true;
    btn.innerText = "Authenticating...";
    alertBox.style.display = 'none';

    frappe.call({
        method: "login",
        args: {
            usr: usr,
            pwd: pwd
        },
        callback: function(r) {
            if (r.message === "Logged In") {
                window.location.href = "/frapnora";
            } else {
                btn.disabled = false;
                btn.innerText = "Sign In to Portal";
            }
        },
        error: function(r) {
            btn.disabled = false;
            btn.innerText = "Sign In to Portal";
            alertBox.innerText = (r.message || "Invalid credentials. Please verify your username and password.");
            alertBox.style.display = 'block';
        }
    });
}
</script>
{% endblock %}
