{% extends "templates/web.html" %}

{% block page_content %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');

  :root {
    --bg-app: #f5f6f8;
    --bg-surface: #ffffff;
    --bg-surface-elevated: #f0f2f5;
    --border-subtle: #e2e4e9;
    --border-strong: #cbd0d8;
    --text-primary: #111827;
    --text-secondary: #525866;
    --text-muted: #868c98;
    --accent-red: #e11d48;
    --accent-red-hover: #cc123b;
    --accent-blue: #2563eb;
    --accent-blue-hover: #1d4ed8;
    --accent-green: #10b981;
  }

  [data-theme="dark"] {
    --bg-app: #0c0f17;
    --bg-surface: #171d2b;
    --bg-surface-elevated: #202738;
    --border-subtle: #242c3d;
    --border-strong: #333e54;
    --text-primary: #f8fafc;
    --text-secondary: #9aa2b1;
    --text-muted: #626b7d;
  }

  .web-footer, .page-header, header.navbar, .navbar-light, .navbar-default {
    display: none !important;
  }

  .web-page-content,
  .page-container,
  .page-content-wrapper,
  .main-section,
  .container,
  .container-fluid {
    max-width: 100% !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  html, body, .web-page {
    background-color: var(--bg-app) !important;
    margin: 0 !important;
    padding: 0 !important;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    color: var(--text-primary) !important;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    -webkit-font-smoothing: antialiased;
  }

  .font-serif-heading {
    font-family: 'Instrument Serif', Georgia, serif;
    font-weight: 400;
    letter-spacing: -0.02em;
  }

  .font-mono {
    font-family: 'JetBrains Mono', monospace !important;
  }

  /* LOGIN LAYOUT WRAPPER */
  .login-page-wrapper {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 32px 16px;
  }

  .login-top-bar {
    width: 100%;
    max-width: 1100px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand-logo-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none !important;
  }

  .brand-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: var(--accent-red);
  }

  .brand-name {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--text-primary);
  }

  .btn-theme-toggle {
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .login-card-container {
    width: 100%;
    max-width: 420px;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    padding: 36px 32px;
    box-shadow: 0 16px 32px rgba(0, 0, 0, 0.04);
    margin: 40px auto;
  }

  .login-card-header {
    text-align: center;
    margin-bottom: 28px;
  }

  .login-title-hero {
    font-size: 2.8rem;
    line-height: 1.05;
    color: var(--text-primary);
    margin: 0 0 6px 0;
  }

  .login-subtitle {
    font-size: 0.88rem;
    color: var(--text-secondary);
    margin: 0;
  }

  .form-group-item {
    margin-bottom: 20px;
  }

  .form-label-custom {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 6px;
    display: block;
  }

  .input-control-custom {
    background: var(--bg-surface-elevated) !important;
    border: 1px solid var(--border-subtle) !important;
    color: var(--text-primary) !important;
    border-radius: 8px !important;
    padding: 10px 14px !important;
    font-size: 0.9rem !important;
    width: 100%;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .input-control-custom:focus {
    border-color: var(--accent-blue) !important;
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12) !important;
    outline: none;
  }

  .btn-login-submit {
    background: var(--accent-red);
    color: #ffffff !important;
    border: none;
    font-size: 0.9rem;
    font-weight: 600;
    width: 100%;
    padding: 11px;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.15s ease;
    box-shadow: 0 2px 6px rgba(225, 29, 72, 0.2);
    margin-top: 8px;
  }

  .btn-login-submit:hover {
    opacity: 0.92;
    transform: translateY(-1px);
  }

  .login-footer-text {
    font-size: 0.78rem;
    color: var(--text-muted);
    text-align: center;
    margin-top: 24px;
  }
</style>

<div class="login-page-wrapper">
  
  <div class="login-top-bar">
    <a href="/home" class="brand-logo-wrap">
      <span class="brand-dot"></span>
      <span class="brand-name">FRANORA</span>
    </a>

    <button type="button" class="btn-theme-toggle" onclick="toggleSharedTheme()">
      <span>🌙</span>
      <span id="loginThemeText">Dark</span>
    </button>
  </div>

  <div class="login-card-container">
    <div class="login-card-header">
      <h1 class="login-title-hero font-serif-heading">FRAPNORA</h1>
      <p class="login-subtitle">Sign in to access your inventory portal</p>
    </div>

    <form id="loginForm" onsubmit="handleFrappeLogin(event)">
      <div class="form-group-item">
        <label class="form-label-custom" for="login_user">Email or Username</label>
        <input type="text" id="login_user" class="input-control-custom" placeholder="name@company.com" required autocomplete="username">
      </div>

      <div class="form-group-item">
        <label class="form-label-custom" for="login_password">Password</label>
        <input type="password" id="login_password" class="input-control-custom" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-login-submit" id="btnLoginSubmit">
        Sign In
      </button>

      <div id="loginAlertBox" class="small text-danger text-center mt-3" style="display: none;"></div>
    </form>

    <div class="login-footer-text">
      FRANORA Inventory & Dispatch System &copy; 2026
    </div>
  </div>

  <div class="text-muted small text-center" style="font-size: 0.72rem;">
    Authorized Personnel Only
  </div>

</div>

<script>
function initSharedTheme() {
  var saved = localStorage.getItem('frapnora_theme') || 'light';
  applyTheme(saved);
}

function toggleSharedTheme() {
  var current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  var next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('frapnora_theme', theme);
  var txt = document.getElementById('loginThemeText');
  if (txt) txt.innerText = (theme === 'dark') ? 'Light' : 'Dark';
}

function handleFrappeLogin(e) {
  e.preventDefault();
  var usr = document.getElementById('login_user').value.trim();
  var pwd = document.getElementById('login_password').value;
  var btn = document.getElementById('btnLoginSubmit');
  var alertBox = document.getElementById('loginAlertBox');

  btn.disabled = true;
  btn.innerText = "Signing in...";
  alertBox.style.display = "none";

  frappe.call({
    method: "login",
    args: { usr: usr, pwd: pwd },
    callback: function(r) {
      if (r.message === "Logged In") {
        window.location.href = "/frapnora";
      } else {
        btn.disabled = false;
        btn.innerText = "Sign In";
        alertBox.innerText = "Invalid credentials. Please verify your username and password.";
        alertBox.style.display = "block";
      }
    },
    error: function() {
      btn.disabled = false;
      btn.innerText = "Sign In";
      alertBox.innerText = "Login failed. Check server status or credentials.";
      alertBox.style.display = "block";
    }
  });
}

initSharedTheme();
</script>
{% endblock %}
