{% extends "templates/web.html" %}

{% block page_content %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --kite-blue: #387ed1;
    --kite-blue-hover: #2969b5;
    --kite-orange: #ff5722;
    --text-dark: #424242;
    --text-heading: #222222;
    --border-color: #e0e0e0;
  }

  /* Reset Frappe outer container background */
  html, body, .web-page, .page-container, .main-section {
    background-color: #fcfcfc !important;
  }

  body {
    color: var(--text-dark) !important;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    margin: 0;
    -webkit-font-smoothing: antialiased;
  }

  .kite-login-wrapper {
    min-height: 85vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .kite-card-container {
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    width: 100%;
    max-width: 380px;
    padding: 40px 36px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
  }

  .brand-logo-icon {
    display: flex;
    justify-content: center;
    margin-bottom: 14px;
    color: var(--kite-blue);
  }

  .kite-brand-title {
    font-size: 1.45rem;
    font-weight: 600;
    color: var(--text-heading);
    letter-spacing: -0.5px;
    margin-bottom: 24px;
    text-align: center;
  }

  .kite-form-label {
    font-size: 0.8rem;
    font-weight: 500;
    color: #666666;
    margin-bottom: 6px;
    display: block;
  }

  .kite-input {
    width: 100%;
    background: #ffffff !important;
    border: 1px solid var(--border-color) !important;
    border-radius: 3px;
    padding: 10px 12px;
    font-size: 0.9rem;
    color: #333333 !important;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .kite-input:focus {
    border-color: var(--kite-blue) !important;
    box-shadow: 0 0 0 1px var(--kite-blue) !important;
  }

  /* Password wrapper & toggle button */
  .password-container {
    position: relative;
    width: 100%;
  }

  .password-container .kite-input {
    padding-right: 42px;
  }

  .password-toggle-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: #888888;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s ease;
  }

  .password-toggle-btn:hover {
    color: var(--kite-blue);
  }

  .btn-kite-submit {
    background-color: var(--kite-blue);
    color: #ffffff !important;
    border: none;
    width: 100%;
    padding: 11px;
    font-size: 0.95rem;
    font-weight: 600;
    border-radius: 3px;
    cursor: pointer;
    transition: background-color 0.15s ease;
    margin-top: 10px;
  }

  .btn-kite-submit:hover {
    background-color: var(--kite-blue-hover);
  }

  .btn-kite-submit:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }

  .kite-error-box {
    display: none;
    background-color: #fef2f2;
    border: 1px solid #fee2e2;
    color: #b91c1c;
    font-size: 0.82rem;
    padding: 8px 12px;
    border-radius: 3px;
    margin-top: 14px;
    text-align: center;
  }

  .back-to-home {
    margin-top: 24px;
    font-size: 0.85rem;
    color: #777777;
    text-decoration: none;
    display: inline-block;
  }

  .back-to-home:hover {
    color: var(--kite-blue);
  }
</style>

<div class="kite-login-wrapper">
  
  <div class="kite-card-container">
    <div class="brand-logo-icon">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" stroke="#387ed1" />
        <polyline points="3.27 6.96 12 12.01 20.73 6.96" stroke="#387ed1" />
        <line x1="12" y1="22.08" x2="12" y2="12" stroke="#387ed1" />
      </svg>
    </div>

    <div class="kite-brand-title">Login to Frapnora</div>

    <form id="login-form" method="post" onsubmit="return false;">
      <div class="mb-3">
        <label class="kite-form-label" for="login_email">User ID or Email</label>
        <input type="text" id="login_email" class="kite-input" placeholder="e.g. manager@frapnora.com" required autofocus autocomplete="username">
      </div>

      <div class="mb-4">
        <label class="kite-form-label" for="login_password">Password</label>
        <div class="password-container">
          <input type="password" id="login_password" class="kite-input" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility()" title="Show/Hide Password">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="button" id="btn-login" class="btn-kite-submit" onclick="executeCustomLogin()">
        Login
      </button>
    </form>
    
    <div id="login-message" class="kite-error-box"></div>
  </div>

  <a href="/home" class="back-to-home">← Back to Overview</a>
</div>

<script>
function togglePasswordVisibility() {
    var pwdInput = document.getElementById('login_password');
    var eyeIcon = document.getElementById('eye-icon');

    if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        // Switch to an "eye-off" icon
        eyeIcon.innerHTML = `
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
    } else {
        pwdInput.type = 'password';
        // Switch back to regular "eye" icon
        eyeIcon.innerHTML = `
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        `;
    }
}

function executeCustomLogin() {
    var usr = document.getElementById('login_email').value.trim();
    var pwd = document.getElementById('login_password').value;
    var msgEl = document.getElementById('login-message');
    var btn = document.getElementById('btn-login');

    if (!usr || !pwd) {
        msgEl.innerText = "Please provide both User ID and Password.";
        msgEl.style.display = "block";
        return;
    }

    msgEl.style.display = "none";
    btn.disabled = true;
    btn.innerText = "Signing in...";

    frappe.call({
        method: "login",
        args: { usr: usr, pwd: pwd },
        callback: function(r) {
            if (!r.exc) {
                window.location.href = "/frapnora";
            } else {
                btn.disabled = false;
                btn.innerText = "Login";
                msgEl.innerText = "Invalid credentials. Please verify your username and password.";
                msgEl.style.display = "block";
            }
        },
        error: function(r) {
            btn.disabled = false;
            btn.innerText = "Login";
            msgEl.innerText = "Connection error. Please try again.";
            msgEl.style.display = "block";
        }
    });
}

document.addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
        executeCustomLogin();
    }
});
</script>
{% endblock %}
